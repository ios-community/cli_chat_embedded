[workspace]
members = ["core", "runner_std"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Dzulkifli Anwar"]
description = "Zero-heap, single-threaded CLI chat core for embedded devices."
license = "MIT"
repository = "https://codeberg.org/ios-community/cli_chat_embedded"
keywords = ["no_std", "embedded", "cli", "chat", "zero-alloc"]
categories = ["embedded", "command-line-interface"]
readme = "README.md"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "warn"
